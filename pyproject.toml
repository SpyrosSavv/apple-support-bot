[project]
name = "production-ai-app"
version = "0.2.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]  # B008: FastAPI's Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["app", "evals", "scripts", "tests", "attack_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "services/attack_detector"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
